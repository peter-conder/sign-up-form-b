<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
    <section id="pageContent">

    <div id="logoSection">
        <div id="background">
        <div id="logotext">Orange Organization</div>
        <img src="/images/orange-slice.png" id="orange">
        </div>

    </div>

    <div id="content">

        <div id="headertext">
        <p class="header">"When life gives you lemons, make orange juice"</p>
        <p class="header">Sign up for our service to start making bad decisions today!</p>
        </div>


        <div class="formContainer">
        <form action="" method="post" class="inputForm">

            <section class="formDiv">
            <div>
                <label for="firstname" name="firstname">First Name</label>
                <input type="text" name="firstname" id="firstname" required/>
            </div>

            <div>
                <label for="email" name="email" class="email">Email</label>
                <input type="email" name="email" id="email" required/>
            </div>

            <div>
                <label for="password" name="password">Password</label>
                <input type="password" name="password" id="password" required/>
            </div>
            </section>

            <section class="formDiv">
            <div>
                <label for="lastname" name="lastname">Last Name</label>
                <input type="text" name="lastname" id="lastname" required/>
            </div>


            <div>
                <label for="phone" name="phone">Phone Number</label>
                <input type="tel" name="phone" id="phone" required/>
            </div>

            <div>
                <label for="confirm" name="confirm">Confirm Password</label>
                <input type="password" name="password" id="password" required/>
            </div>
            </section>

            <input type="submit" id="submitButton" value="Create Account">
        </form>
        </div>
            <p id="account">Already have a account? <button id="signIn">Sign In</button></p>

    </div>
    </section>
</body>
</html>
